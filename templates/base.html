<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}LinkService{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --navy: #0f172a;
        --blue: #2563eb;
        --sky: #38bdf8;
        --teal: #14b8a6;
        --light: #f3f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #64748b;
        --line: #e2e8f0;
        --success: #16a34a;
        --warning: #f59e0b;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(180deg, #edf6ff 0%, #f9fbfd 100%);
        font-family: 'Inter', sans-serif;
        color: var(--text);
      }
      a { text-decoration: none; }
      .container { max-width: 1200px; margin: 0 auto; padding: 0 22px; }
      .topbar {
        background: rgba(15,23,42,0.96);
        color: white;
        padding: 18px 0;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .topbar .inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: 0.4px;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--sky), var(--blue));
        display: grid;
        place-items: center;
        font-size: 16px;
        font-weight: 800;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .nav a {
        color: #e2e8f0;
        font-size: 14px;
        font-weight: 600;
      }
      .nav .btn {
        padding: 10px 18px;
        border-radius: 12px;
        background: var(--sky);
        color: #0f172a;
        font-weight: 700;
      }
      .hero {
        padding: 70px 0 35px;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.25fr 0.95fr;
        gap: 30px;
        align-items: center;
      }
      .badge {
        display: inline-flex;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(56,189,248,0.12);
        color: var(--blue);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(2.4rem, 4vw, 4rem);
        line-height: 1.07;
        margin: 18px 0 18px;
      }
      .hero p {
        font-size: 1.06rem;
        line-height: 1.8;
        color: var(--muted);
      }
      .hero-actions {
        display: flex;
        gap: 16px;
        margin-top: 30px;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-block;
        padding: 14px 22px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
      }
      .btn-primary { background: var(--navy); color: white; }
      .btn-secondary { background: linear-gradient(135deg, var(--sky), var(--blue)); color: white; }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 14px;
        margin-top: 26px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 16px;
      }
      .stat strong { display: block; font-size: 1.5rem; }
      .stat span { color: var(--muted); font-size: 13px; }
      .panel {
        background: linear-gradient(180deg, #ffffff, #f9fbff);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 26px;
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.08);
      }
      .panel h3 {
        margin-top: 0;
        margin-bottom: 12px;
      }
      .contact-card {
        margin-top: 22px;
        padding: 18px 20px;
        border-radius: 18px;
        background: #f8fafc;
        border: 1px solid var(--line);
      }
      .contact-card p { margin: 8px 0; color: var(--muted); }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 30px;
      }
      .mini-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px 18px;
      }
      .mini-card h4 { margin: 0 0 10px; }
      .mini-card p { margin: 0; color: var(--muted); line-height: 1.7; }
      .form-shell {
        max-width: 980px;
        margin: 50px auto;
        background: var(--card);
        border-radius: 28px;
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .auth-tabs {
        display: flex;
        gap: 16px;
        padding: 24px 30px 8px;
      }
      .auth-tabs button {
        border: none;
        background: #e2e8f0;
        color: var(--text);
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
      }
      .auth-tabs .active {
        background: var(--navy);
        color: white;
      }
      .auth-form {
        padding: 24px 30px 32px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(200px, 1fr));
        gap: 18px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .field label {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .field input, .field select, .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: #f8fafc;
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
      }
      .field textarea { min-height: 120px; resize: vertical; }
      .button-row { margin-top: 20px; }
      .flash {
        margin: 18px 30px 0;
        padding: 12px 14px;
        border-radius: 12px;
        font-weight: 600;
      }
      .flash.error { background: #fee2e2; color: #991b1b; }
      .flash.success { background: #dcfce7; color: #166534; }
      .dashboard {
        max-width: 1280px;
        margin: 30px auto 50px;
      }
      .dashboard-shell {
        display: grid;
        grid-template-columns: 2.3fr 1fr;
        gap: 20px;
      }
      .feed, .sidebar {
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 20px;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .toolbar input, .toolbar select {
        flex: 1;
        min-width: 150px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .post {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        margin-bottom: 16px;
        padding: 18px;
      }
      .post-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .pill {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #dbeafe;
        color: var(--blue);
        font-size: 11px;
        font-weight: 700;
      }
      .chat-box {
        height: 420px;
        overflow: auto;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }
      .message {
        margin-bottom: 10px;
        max-width: 85%;
        padding: 10px 12px;
        border-radius: 12px;
        line-height: 1.5;
      }
      .message.me {
        margin-left: auto;
        background: var(--navy);
        color: white;
      }
      .message.other {
        background: white;
        border: 1px solid var(--line);
      }
      .profile-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 26px;
      }
      .profile-header {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 18px;
      }
      .avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--sky), var(--blue));
        color: white;
        font-weight: 800;
        font-size: 28px;
      }
      .profile-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(180px, 1fr));
        gap: 12px;
      }
      .meta {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        background: #f8fafc;
      }
      @media (max-width: 900px) {
        .hero-grid, .dashboard-shell, .card-grid, .grid-2 { grid-template-columns: 1fr; }
        .stats { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
